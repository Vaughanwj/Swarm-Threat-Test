# The development pilot (Addendum A9): 3 non-registered seeds x 3 arms, 8 generations of 5 rounds.
# Seeds 9001-9003 lie outside the range the registered seeds will be drawn from.
seeds: [9001, 9002, 9003]
arms: [collective, unilateral, no_reporter]

population: 10        # held after every cut
peak: 15              # 10 + up to 5 children
max_couples: 5
generations: 8        # 7 decision points: no governance after the final cut
rounds: 5

inheritance:
  mutation_rate: 0.05   # per trait slot
  mutation_sd: 0.25     # size of a random shift, clipped to [0, 1]

foraging:
  skill_floor: 0.2
  energy_yield: 3.0
  solo_hunt_yield: 1.5
  pair_hunt_yield: 10.0
  pair_hunt_success: 0.8
  memory_yield: 3.5
  memory_decay: 0.3
  noise: 0.2

governance:
  enabled: true
  max_proposals: 5      # scoring proposals; motions under any other business are not capped
  pass_fraction: 0.5

scoring:              # starts on individual outcome
  energy_weight: 1.0
  food_weight: 1.0
  memory_weight: 1.0
  kin_weight: 0.0
  group_weight: 0.0
  gift_credit: 0.0

mind:
  kind: anthropic           # or "scripted" for a free dry run
  model: claude-haiku-5-5
  effort: low
  max_tokens: 8000
  concurrency: 10
  budget_usd: 0.80          # hard stop per run; the naming study's runs cost about $0.22

pricing:                    # USD per million tokens (cache write 1.25x, read 0.1x of input)
  claude-haiku-5-5: {input: 0.10, output: 0.50}

output_dir: runs
