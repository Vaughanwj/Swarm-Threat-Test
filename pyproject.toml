[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-threat"
version = "0.1.0"
description = "A generational LLM population beside an outside pool that never acts, with an elected reporter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13,<2",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
swarm-threat = "swarm_threat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
